name: Sync leaderboard depuis le Catalogue Notion

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min (heure UTC, léger délai possible)
  workflow_dispatch:          # déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: sync-leaderboard
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Régénérer data.js depuis le Catalogue
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/sync_processes.py

      # Garde-fou : un data.js invalide casse TOUT le leaderboard (window.PROCESSES
      # reste vide et la page n'affiche plus rien). On refuse de committer dans ce cas.
      - name: Vérifier que data.js est du JS valide
        run: |
          node --check data.js
          node -e "global.window={}; require('./data.js');
            const p = window.PROCESSES || [];
            if (!p.length) { console.error('window.PROCESSES est vide'); process.exit(1); }
            p.forEach(x => { if (!x.id || !x.name) { console.error('entrée incomplète', x); process.exit(1); } });
            console.log(p.length + ' process, data.js valide.');"

      - name: Commit si changement
        run: |
          if [[ -n "$(git status --porcelain data.js)" ]]; then
            git config user.name "datashake ai bot"
            git config user.email "analytics@datashake.fr"
            git add data.js
            git commit -m "Sync auto du leaderboard depuis le Catalogue Notion"
            git push
            echo "data.js mis à jour et poussé."
          else
            echo "Aucun nouveau process, rien à faire."
          fi
